<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llama 3.2 3B Instruct · byhand</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">
  <script>
    if (new URLSearchParams(window.location.search).has("embedded")) {
      document.documentElement.classList.add("embedded-preview");
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0c0d0f; color: #e5e5e5;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas,
        "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    .shell {
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .toolbar {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: center;
      gap: 12px; min-height: 58px; padding: 10px 16px;
      background: rgb(17 18 21 / 94%); border-bottom: 1px solid #303238;
      backdrop-filter: blur(10px); font-size: 12px;
    }
    .identity { min-width: 210px; margin-right: auto; }
    .identity strong { display: block; color: #fff; font-size: 14px; }
    .identity span { color: #9699a1; font-size: 12px; }
    button {
      flex: 0 0 auto; white-space: nowrap;
      min-width: 42px; height: 34px; padding: 0 12px;
      border: 1px solid #494c54; border-radius: 6px;
      background: #22242a; color: #f0f0f0; font: inherit; cursor: pointer;
    }
    button:hover:not(:disabled), button:focus-visible {
      border-color: rgb(235 70 205); outline: none;
    }
    button:disabled { cursor: default; opacity: .35; }
    button[hidden] { display: none; }
    .operation-picker {
      width: clamp(190px, 27vw, 330px); height: 34px; padding: 0 30px 0 10px;
      border: 1px solid #494c54; border-radius: 6px;
      background: #22242a; color: #f0f0f0; font: inherit; cursor: pointer;
    }
    .operation-picker:hover:not(:disabled),
    .operation-picker:focus-visible {
      border-color: rgb(235 70 205); outline: none;
    }
    .operation-picker:disabled { cursor: default; opacity: .35; }
    .layout-switch {
      display: flex; flex: 0 0 auto; padding: 3px; border: 1px solid #3a3d44;
      border-radius: 8px; background: #17191d;
    }
    .layout-switch button {
      min-width: auto; height: 28px; padding: 0 10px;
      border: 0; background: transparent; color: #9699a1;
    }
    .layout-switch button[aria-pressed="true"] {
      background: #343740; color: #fff; box-shadow: 0 0 0 1px #50545e;
    }
    #position {
      display: inline-flex; flex: 0 0 auto; align-items: center;
      justify-content: center; min-width: 64px; height: 34px; padding: 0 8px;
      border: 1px solid #494c54; border-radius: 6px;
      background: #22242a; color: #d9dbe1; font-size: 12px;
      text-align: center; white-space: nowrap;
    }
    .workspace { display: flex; flex: 1 1 auto; min-height: 0; }
    .viewport {
      flex: 1 1 auto; min-height: 0; overflow: auto; padding: 18px;
      overscroll-behavior: contain;
    }
    .terminal {
      display: inline-block; min-width: max-content; margin: 0; padding: 0;
      color: #e5e5e5; background: transparent;
      font: 14px/1 ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas,
        "Liberation Mono", "DejaVu Sans Mono", monospace;
      font-variant-ligatures: none; letter-spacing: 0; tab-size: 1;
      white-space: pre;
    }
    .side-explainer {
      display: flex; flex: 0 0 clamp(360px, 42vw, 680px);
      min-width: 0; flex-direction: column; border-left: 1px solid #303238;
      background: #121317; outline: none;
    }
    .side-explainer[hidden] { display: none; }
    .side-header {
      display: flex; align-items: center; gap: 12px; min-height: 52px;
      padding: 8px 12px; border-bottom: 1px solid #303238;
    }
    .side-header strong { color: #fff; font-size: 13px; }
    .side-close {
      min-width: 34px; height: 30px; margin-left: auto; padding: 0 8px;
    }
    .side-viewport { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
    .side-terminal { font-size: 13px; }
    .cell-run {
      display: inline-block;
      inline-size: calc(var(--cells) * 1ch);
      vertical-align: top;
      white-space: pre;
    }
    html.embedded-preview .terminal { font-size: 11px; }
    html.embedded-preview .side-terminal { font-size: 10px; }
    .hint { color: #737780; font-size: 12px; white-space: nowrap; }
    .load-status { margin: 0; color: #9699a1; font-size: 13px; }
    .load-status.error { color: #ff9b9b; white-space: pre-line; }
    .load-status[hidden] { display: none; }
    @media (max-width: 960px) {
      .toolbar { flex-wrap: wrap; gap: 8px; }
      .identity { flex: 1 0 100%; }
      .toolbar > button { height: 34px; }
      .layout-switch button { height: 28px; }
      .hint { margin-left: auto; white-space: normal; }
    }
    @media (max-width: 720px) {
      .operation-picker { width: min(100%, 330px); }
      .viewport { padding: 10px; }
      .terminal { font-size: 12px; }
      .workspace { flex-direction: column; }
      .side-explainer {
        flex: 0 0 46%; border-top: 1px solid #303238; border-left: 0;
      }
      .side-viewport { padding: 10px; }
      .side-close { height: 38px; }
    }
  </style>
</head>

    function centerActiveRow() {
      const lineHeight = Number.parseFloat(
        window.getComputedStyle(terminal).lineHeight
      );
      const terminalTop = terminal.getBoundingClientRect().top
        - viewport.getBoundingClientRect().top + viewport.scrollTop;
      const activeCenter = terminalTop + (focusRows[step] + 0.5) * lineHeight;
      const maximum = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
      const target = Math.max(
        0,
        Math.min(maximum, activeCenter - viewport.clientHeight / 2)
      );
      viewport.scrollTo({ top: target, behavior: "auto" });
    }

      previous.hidden = false;
      next.hidden = false;
      previous.disabled = step === 0;
      next.disabled = step === frames.length - 1;
      operationPicker.disabled = false;
      operationPicker.value = String(step);
      explainer.disabled = !available;
      fullLayout.disabled = !available;
      sideLayout.disabled = !available;
      explainer.textContent = "Explainer →";
      hint.textContent = "Use ↑/↓ to step · → for Explainer";
      viewTitle.textContent = "Llama visualization";
    }

    function show(requested) {
      explainerMode = false;
      sideExplainer.hidden = true;
      sideExplainer.setAttribute("aria-hidden", "true");
      step = Math.max(0, Math.min(frames.length - 1, requested));
      terminal.innerHTML = frames[step];
      operationPicker.value = String(step);
      position.textContent = `${step + 1} / ${frames.length}`;
      updateModelControls();
      window.requestAnimationFrame(centerActiveRow);
    }

    function showExplainer() {
      const detail = explainers && explainers[step];
      if (!detail) return;
      explainerMode = true;
      explainerRow = Math.max(0, Math.min(detail.rows - 1, explainerRow));
      explainerColumn = Math.max(
        0,
        Math.min(detail.columns - 1, explainerColumn)
      );
      const index = explainerRow * detail.columns + explainerColumn;
      operationPicker.value = String(step);
      explainer.disabled = false;
      explainer.textContent = "← Model";
      fullLayout.disabled = false;
      sideLayout.disabled = false;
      if (explainerLayout === "side") {
        terminal.innerHTML = frames[step];
        position.textContent = `${step + 1} / ${frames.length}`;
        previous.hidden = false;
        next.hidden = false;
        previous.disabled = step === 0;
        next.disabled = step === frames.length - 1;
        sideTerminal.innerHTML = detail.frames[index];
        sideExplainer.hidden = false;
        sideExplainer.setAttribute("aria-hidden", "false");
        hint.textContent = "Arrows: select · Esc: close";
        viewTitle.textContent = "Llama visualization";
        sideExplainer.focus({ preventScroll: true });
      } else {
        sideExplainer.hidden = true;
        sideExplainer.setAttribute("aria-hidden", "true");
        terminal.innerHTML = detail.frames[index];
        position.textContent = `${step + 1} / ${frames.length}`;
        previous.hidden = true;
        next.hidden = true;
        hint.textContent = "Arrows: select · Esc: Model View";
        viewTitle.textContent = "Operation Explainer";
        viewport.scrollTo({ top: 0, left: 0, behavior: "auto" });
      }
    }

    function setExplainerLayout(layout) {
      explainerLayout = layout;
      fullLayout.setAttribute("aria-pressed", String(layout === "full"));
      sideLayout.setAttribute("aria-pressed", String(layout === "side"));
      if (explainerMode) showExplainer();
    }

    function changeStep(offset) {
      const requested = Math.max(0, Math.min(frames.length - 1, step + offset));
      if (
        explainerMode && explainerLayout === "side"
        && explainers && explainers[requested]
      ) {
        step = requested;
        explainerRow = 0;
        explainerColumn = 0;
        showExplainer();
      } else {
        show(requested);
      }
    }

    function openExplainer() {
      if (!explainers || !explainers[step]) return;
      explainerRow = 0;
      explainerColumn = 0;
      showExplainer();
    }

    function chooseStep(requested) {
      const selected = Math.max(
        0, Math.min(frames.length - 1, requested)
      );
      if (explainerMode && explainers && explainers[selected]) {
        step = selected;
        explainerRow = 0;
        explainerColumn = 0;
        showExplainer();
      } else {
        show(selected);
      }
    }

    function populateOperationPicker() {
      operationPicker.replaceChildren();
      operations.forEach((operation, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent =
          `${index + 1}. ${operation.section} · ${operation.name}`;
        operationPicker.append(option);
      });
    }

    function showLoadError(error) {
      console.error("Unable to load byhand visualization", error);
      viewport.setAttribute("aria-busy", "false");
      loadStatus.hidden = false;
      loadStatus.classList.add("error");
      loadStatus.textContent =
        "Unable to load this visualization.\n" +
        "The browser could not decompress the embedded model data.";
      position.textContent = "Unavailable";
      hint.textContent = "Try opening the file in an up-to-date browser.";
      viewTitle.textContent = "Visualization unavailable";
      previous.disabled = true;
      next.disabled = true;
      explainer.disabled = true;
      fullLayout.disabled = true;
      sideLayout.disabled = true;
      operationPicker.disabled = true;
    }

    async function unpackPayload() {
      try {
        if (typeof DecompressionStream !== "function") {
          throw new Error("DecompressionStream is not supported");
        }
        const bytes = Uint8Array.from(atob(packedPayload), character =>
          character.charCodeAt(0)
        );
        const stream = new Blob([bytes]).stream().pipeThrough(
          new DecompressionStream("gzip")
        );
        const payload = JSON.parse(await new Response(stream).text());
        if (
          !Array.isArray(payload.frames)
          || payload.frames.length === 0
          || !Array.isArray(payload.focusRows)
          || payload.focusRows.length !== payload.frames.length
          || !Array.isArray(payload.operations)
          || payload.operations.length !== payload.frames.length
          || !payload.explainers
          || typeof payload.explainers !== "object"
        ) {
          throw new Error("Embedded visualization data is invalid");
        }
        frames = payload.frames;
        focusRows = payload.focusRows;
        operations = payload.operations;
        explainers = payload.explainers;
        populateOperationPicker();
        viewport.setAttribute("aria-busy", "false");
        loadStatus.hidden = true;
        show(step);
        setExplainerLayout("full");
      } catch (error) {
        showLoadError(error);
      }
    }

    previous.addEventListener("click", () => changeStep(-1));
    next.addEventListener("click", () => changeStep(1));
    operationPicker.addEventListener("change", () => {
      chooseStep(Number.parseInt(operationPicker.value, 10));
    });
    fullLayout.addEventListener("click", () => setExplainerLayout("full"));
    sideLayout.addEventListener("click", () => setExplainerLayout("side"));
    sideClose.addEventListener("click", () => show(step));
    explainer.addEventListener("click", () => {
      if (explainerMode) show(step);
      else openExplainer();
    });
    document.addEventListener("keydown", (event) => {
      if (!frames) return;
      if (explainerMode) {
        if (event.key === "Escape") {
          event.preventDefault(); show(step);
        } else if (event.key === "ArrowUp") {
          event.preventDefault(); explainerRow -= 1; showExplainer();
        } else if (event.key === "ArrowDown") {
          event.preventDefault(); explainerRow += 1; showExplainer();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault(); explainerColumn -= 1; showExplainer();
        } else if (event.key === "ArrowRight") {
          event.preventDefault(); explainerColumn += 1; showExplainer();
        }
      } else if (event.key === "ArrowUp") {
        event.preventDefault(); show(step - 1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault(); show(step + 1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault(); openExplainer();
      } else if (event.key === "Home") {
        event.preventDefault(); show(0);
      } else if (event.key === "End") {
        event.preventDefault(); show(frames.length - 1);
      }
    });
    unpackPayload();
  </script>
